<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    
    --ink-950:#150c2b;
    --ink-900:#1d1140;
    --ink-800:#2a1a5c;
    --violet-600:#6d28d9;
    --violet-400:#a78bfa;
    --paper:#f7f2e7;
    --paper-dim:#d9cfb8;
    --gold:#e3a92b;
    --gold-light:#f4cd6a;
    --ok-blue:#7dc4e0;
    --ok-green:#8fd19e;
    --ok-purple:#c9a6f2;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    min-height:100vh;
    font-family:'Inter', sans-serif;
    color:var(--paper);
    background:var(--ink-950);
    position:relative;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:64px 20px;
  }

  /* ---------- animated backdrop (same as main app) ---------- */
  .bg-aurora{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(109,40,217,0.55), transparent 60%),
      radial-gradient(ellipse 70% 50% at 85% 20%, rgba(227,169,43,0.18), transparent 55%),
      radial-gradient(ellipse 90% 70% at 50% 100%, rgba(42,26,92,0.9), transparent 60%),
      linear-gradient(180deg, var(--ink-950), var(--ink-900) 55%, var(--ink-950));
    animation: driftBg 22s ease-in-out infinite alternate;
  }
  @keyframes driftBg{
    0%{ filter:hue-rotate(0deg) brightness(1); }
    100%{ filter:hue-rotate(8deg) brightness(1.06); }
  }

  .ink-blot{
    position:fixed;
    border-radius:50%;
    filter:blur(2px);
    opacity:0.55;
    z-index:0;
    background:radial-gradient(circle at 30% 30%, var(--gold-light), transparent 70%);
    animation: floaty linear infinite;
  }
  @keyframes floaty{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); }
    50%{ transform:translateY(-40px) translateX(20px) rotate(180deg); }
    100%{ transform:translateY(0) translateX(0) rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-aurora, .ink-blot, *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }

  /* ---------- card ---------- */
  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    background:linear-gradient(155deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:28px;
    padding:44px;
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .brand-row{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:8px;
  }
  .brand-mark{
    width:52px;height:52px;border-radius:16px;
    background:linear-gradient(135deg, var(--gold-light), var(--gold));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px -6px rgba(227,169,43,0.55);
    flex-shrink:0;
  }
  .brand-mark svg{ width:28px; height:28px; }

  h1.title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.85rem;
    letter-spacing:-0.01em;
    margin:0;
    background:linear-gradient(135deg, #ffffff, var(--gold-light) 120%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  p.tagline{
    margin:2px 0 0;
    color:var(--paper-dim);
    font-size:0.9rem;
  }

  hr.rule{
    border:none;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
    margin:26px 0;
  }

  form{ display:flex; flex-direction:column; gap:20px; }

  label.field-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.78rem;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--gold-light);
    margin-bottom:10px;
  }
  label.field-label::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--gold-light);
    box-shadow:0 0 8px var(--gold-light);
  }

  .field input{
    width:100%;
    padding:14px 16px;
    font-family:'Inter', sans-serif;
    font-size:0.95rem;
    color:var(--paper);
    background:rgba(0,0,0,0.22);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:14px;
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .field input::placeholder{ color:rgba(247,242,231,0.4); }
  .field input:focus{
    border-color:var(--gold-light);
    box-shadow:0 0 0 4px rgba(227,169,43,0.15);
  }
  .field input.invalid{
    border-color:#f3a6a6;
    box-shadow:0 0 0 4px rgba(243,166,166,0.15);
  }
  .field-error{
    font-size:0.76rem;
    color:#f3a6a6;
    margin-top:6px;
    min-height:1rem;
  }

  #status{
    font-size:0.82rem;
    color:var(--paper-dim);
    display:flex;
    align-items:center;
    gap:8px;
    min-height:1.2rem;
  }
  #status.thinking::before{
    content:"";
    width:8px;height:8px;border-radius:50%;
    background:var(--gold-light);
    animation:pulseDot 1s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%,100%{ transform:scale(0.7); opacity:0.5; }
    50%{ transform:scale(1.1); opacity:1; }
  }
  #status.error{ color:#f3a6a6; }
  #status.success{ color:var(--ok-green); }

  button#SignUp{
    position:relative;
    border:none;
    cursor:pointer;
    padding:14px 30px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:0.98rem;
    color:var(--ink-950);
    border-radius:999px;
    background:linear-gradient(135deg, var(--gold-light), var(--gold));
    box-shadow:0 10px 24px -8px rgba(227,169,43,0.6);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
    width:100%;
  }
  button#SignUp:hover{ filter:brightness(1.06); transform:translateY(-1px); box-shadow:0 14px 30px -8px rgba(227,169,43,0.7); }
  button#SignUp:active{ transform:translateY(0) scale(0.98); }
  button#SignUp:disabled{ opacity:0.6; cursor:progress; filter:grayscale(0.15); }
  button#SignUp:focus-visible{ outline:3px solid var(--ok-blue); outline-offset:3px; }

  .switch-line{
    text-align:center;
    font-size:0.85rem;
    color:var(--paper-dim);
    margin-top:22px;
  }
  .switch-line a{
    color:var(--gold-light);
    text-decoration:none;
    font-weight:600;
  }
  .switch-line a:hover{ text-decoration:underline; }

  footer{
    position:relative;
    z-index:1;
    margin-top:36px;
    font-size:0.75rem;
    color:rgba(247,242,231,0.4);
    letter-spacing:0.03em;
  }

  @media (max-width: 480px){
    .card{ padding:30px 22px; border-radius:20px; }
    h1.title{ font-size:1.6rem; }
  }
</style>
</head>
<body>

  <div class="bg-aurora"></div>
  <div class="ink-blot" style="width:260px;height:260px;top:8%;left:6%;animation-duration:26s;"></div>
  <div class="ink-blot" style="width:180px;height:180px;top:65%;left:82%;animation-duration:19s;animation-delay:-4s;"></div>
  <div class="ink-blot" style="width:140px;height:140px;top:80%;left:12%;animation-duration:23s;animation-delay:-9s;"></div>

  <div class="card">

    <div class="brand-row">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" stroke="#150c2b" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M14 4v5h5" stroke="#150c2b" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M7 12h7M7 15.5h5" stroke="#150c2b" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1 class="title">Create your account</h1>
        <p class="tagline">Start chatting with your notes in seconds</p>
      </div>
    </div>

    <hr class="rule">

    <form id="signup-form" novalidate>

      <div class="field">
        <label for="name" class="field-label">Full name</label>
        <input type="text" id="name" name="name" placeholder="Jordan Rivera" autocomplete="name">
        <div class="field-error" id="name-error"></div>
      </div>

      <div class="field">
        <label for="email" class="field-label">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
        <div class="field-error" id="email-error"></div>
      </div>

      <div class="field">
        <label for="password" class="field-label">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password">
        <div class="field-error" id="password-error"></div>
      </div>

      <div class="field">
        <label for="confirm-password" class="field-label">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="At least 6 characters" autocomplete="new-password">
        <div class="field-error" id="confirm-password-error"></div>
      </div>

      <div>
        <div id="status" style="margin-bottom:12px;"></div>
        <button id="SignUp" type="submit">Sign Up</button>
      </div>

    </form>

    <div class="switch-line">
      Already have an account? <a href="#" id="signin-link">Sign in</a>
    </div>

  </div>

  <footer>Built as part of the AI Engineering Bootcamp</footer>

<script src="signup.js"></script>
</body>
</html>
