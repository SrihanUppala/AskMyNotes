<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AskMyNotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-950:#150c2b;
    --ink-900:#1d1140;
    --ink-800:#2a1a5c;
    --violet-600:#6d28d9;
    --violet-400:#a78bfa;
    --paper:#f7f2e7;
    --paper-dim:#d9cfb8;
    --gold:#e3a92b;
    --gold-light:#f4cd6a;
    --ok-blue:#7dc4e0;
    --ok-green:#8fd19e;
    --ok-purple:#c9a6f2;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    min-height:100vh;
    font-family:'Inter', sans-serif;
    color:var(--paper);
    background:var(--ink-950);
    position:relative;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:64px 20px;
  }

  /* ---------- animated backdrop ---------- */
  .bg-aurora{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(109,40,217,0.55), transparent 60%),
      radial-gradient(ellipse 70% 50% at 85% 20%, rgba(227,169,43,0.18), transparent 55%),
      radial-gradient(ellipse 90% 70% at 50% 100%, rgba(42,26,92,0.9), transparent 60%),
      linear-gradient(180deg, var(--ink-950), var(--ink-900) 55%, var(--ink-950));
    animation: driftBg 22s ease-in-out infinite alternate;
  }
  @keyframes driftBg{
    0%{ filter:hue-rotate(0deg) brightness(1); }
    100%{ filter:hue-rotate(8deg) brightness(1.06); }
  }

  .ink-blot{
    position:fixed;
    border-radius:50%;
    filter:blur(2px);
    opacity:0.55;
    z-index:0;
    background:radial-gradient(circle at 30% 30%, var(--gold-light), transparent 70%);
    animation: floaty linear infinite;
  }
  @keyframes floaty{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); }
    50%{ transform:translateY(-40px) translateX(20px) rotate(180deg); }
    100%{ transform:translateY(0) translateX(0) rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-aurora, .ink-blot, *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }

  /* ---------- card ---------- */
  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
    background:linear-gradient(155deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:28px;
    padding:44px;
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .brand-row{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:8px;
  }
  .brand-mark{
    width:52px;height:52px;border-radius:16px;
    background:linear-gradient(135deg, var(--gold-light), var(--gold));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px -6px rgba(227,169,43,0.55);
    flex-shrink:0;
  }
  .brand-mark svg{ width:28px; height:28px; }

  h1.title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2.1rem;
    letter-spacing:-0.01em;
    margin:0;
    background:linear-gradient(135deg, #ffffff, var(--gold-light) 120%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  p.tagline{
    margin:2px 0 0;
    color:var(--paper-dim);
    font-size:0.95rem;
  }

  hr.rule{
    border:none;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
    margin:28px 0;
  }

  label.field-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.78rem;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--gold-light);
    margin-bottom:10px;
  }
  label.field-label::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--gold-light);
    box-shadow:0 0 8px var(--gold-light);
  }

  /* upload dropzone */
  .dropzone{
    position:relative;
    border:1.5px dashed rgba(247,242,231,0.35);
    border-radius:16px;
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:14px;
    transition:border-color .2s ease, background .2s ease;
    background:rgba(255,255,255,0.03);
  }
  .dropzone:focus-within,
  .dropzone:hover{
    border-color:var(--gold-light);
    background:rgba(227,169,43,0.06);
  }
  .dropzone svg{ flex-shrink:0; opacity:0.8; }

  input#pdf-input{
    display:block;
    width:100%;
    font-size:0.85rem;
    color:var(--paper-dim);
    cursor:pointer;
  }
  input#pdf-input::file-selector-button{
    margin-right:14px;
    padding:8px 16px;
    border:none;
    border-radius:999px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:0.8rem;
    color:var(--ink-950);
    background:linear-gradient(135deg, var(--gold-light), var(--gold));
    cursor:pointer;
    transition:filter .15s ease;
  }
  input#pdf-input::file-selector-button:hover{ filter:brightness(1.08); }

  .dz-text{ font-size:0.9rem; color:var(--paper); }
  .dz-sub{ font-size:0.78rem; color:var(--paper-dim); margin-top:2px;}
  #upload-status{
    font-size:0.78rem;
    color:var(--paper-dim);
    margin-top:10px;
  }
  #upload-status.success{ color:var(--ok-green); }

  textarea#question{
    width:100%;
    resize:vertical;
    min-height:96px;
    padding:16px;
    font-family:'Inter', sans-serif;
    font-size:0.95rem;
    color:var(--paper);
    background:rgba(0,0,0,0.22);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:14px;
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  textarea#question::placeholder{ color:rgba(247,242,231,0.4); }
  textarea#question:focus{
    border-color:var(--gold-light);
    box-shadow:0 0 0 4px rgba(227,169,43,0.15);
  }

  .row-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:14px;
    gap:12px;
  }

  #status{
    font-size:0.82rem;
    color:var(--paper-dim);
    display:flex;
    align-items:center;
    gap:8px;
    min-height:1.2rem;
  }
  #status.thinking::before{
    content:"";
    width:8px;height:8px;border-radius:50%;
    background:var(--gold-light);
    animation:pulseDot 1s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%,100%{ transform:scale(0.7); opacity:0.5; }
    50%{ transform:scale(1.1); opacity:1; }
  }
  #status.error{ color:#f3a6a6; }

  /* button */
  button#ask-btn{
    position:relative;
    border:none;
    cursor:pointer;
    padding:13px 30px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    color:var(--ink-950);
    border-radius:999px;
    background:linear-gradient(135deg, var(--gold-light), var(--gold));
    box-shadow:0 10px 24px -8px rgba(227,169,43,0.6);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
    flex-shrink:0;
  }
  button#ask-btn:hover{ filter:brightness(1.06); transform:translateY(-1px); box-shadow:0 14px 30px -8px rgba(227,169,43,0.7); }
  button#ask-btn:active{ transform:translateY(0) scale(0.97); }
  button#ask-btn:disabled{
    opacity:0.6; cursor:progress; filter:grayscale(0.15);
  }
  button#ask-btn:focus-visible{
    outline:3px solid var(--ok-blue);
    outline-offset:3px;
  }

  /* answer area */
  #meta{ display:flex; gap:8px; margin-bottom:10px; min-height:26px; }
  .pill{
    font-family:'JetBrains Mono', monospace;
    font-size:0.7rem;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.16);
    background:rgba(255,255,255,0.06);
    color:var(--paper);
    letter-spacing:0.02em;
  }
  .pill.definition{ color:var(--ok-blue); border-color:rgba(125,196,224,0.4); background:rgba(125,196,224,0.1);}
  .pill.example{ color:var(--ok-green); border-color:rgba(143,209,158,0.4); background:rgba(143,209,158,0.1);}
  .pill.comparison{ color:var(--ok-purple); border-color:rgba(201,166,242,0.4); background:rgba(201,166,242,0.1);}

  #answer{
    padding:20px;
    border-radius:16px;
    background:rgba(0,0,0,0.24);
    border:1px solid rgba(255,255,255,0.1);
    min-height:100px;
    color:var(--paper-dim);
    font-style:italic;
    transition:opacity .3s ease;
  }
  #answer.hidden{ display:none; }
  #answer-text{ font-style:normal; color:var(--paper); line-height:1.55; }

  details#sources-wrap{
    margin-top:16px;
    font-size:0.85rem;
    color:var(--paper-dim);
  }
  details#sources-wrap summary{
    cursor:pointer;
    color:var(--gold-light);
    font-weight:500;
    list-style:none;
  }
  details#sources-wrap summary::-webkit-details-marker{ display:none; }
  details#sources-wrap summary::before{
    content:"▸ ";
    display:inline-block;
    transition:transform .2s ease;
  }
  details#sources-wrap[open] summary::before{ transform:rotate(90deg); }
  #sources{
    padding-left:20px;
    margin-top:10px;
  }
  #sources li{
    margin-bottom:8px;
    padding:10px 12px;
    background:rgba(255,255,255,0.04);
    border-radius:10px;
    list-style:decimal;
  }

  .hidden{ display:none !important; }

  footer{
    position:relative;
    z-index:1;
    margin-top:36px;
    font-size:0.75rem;
    color:rgba(247,242,231,0.4);
    letter-spacing:0.03em;
  }

  @media (max-width: 480px){
    .card{ padding:28px 22px; border-radius:20px; }
    h1.title{ font-size:1.7rem; }
  }
</style>
</head>
<body>

  <div class="bg-aurora"></div>
  <div class="ink-blot" style="width:260px;height:260px;top:8%;left:6%;animation-duration:26s;"></div>
  <div class="ink-blot" style="width:180px;height:180px;top:65%;left:82%;animation-duration:19s;animation-delay:-4s;"></div>
  <div class="ink-blot" style="width:140px;height:140px;top:80%;left:12%;animation-duration:23s;animation-delay:-9s;"></div>

  <div class="card">

    <div class="brand-row">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" stroke="#150c2b" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M14 4v5h5" stroke="#150c2b" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M7 12h7M7 15.5h5" stroke="#150c2b" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1 class="title" id="app-heading" data-testid="app-heading">AskMyNotes</h1>
        <p class="tagline" id="app-subtitle" data-testid="app-subtitle">Chat with your PDF notes using AI-powered retrieval.</p>
      </div>
    </div>

    <hr class="rule">

    <!-- Upload -->
    <div data-testid="upload-section">
      <label for="pdf-input" id="upload-label" class="field-label">Upload your notes</label>
      <div class="dropzone">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke="#e3a92b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" stroke="#e3a92b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input type="file" id="pdf-input" name="pdf-input" accept=".pdf" aria-label="Upload your notes (PDF)" data-testid="pdf-input">
      </div>
      <div class="dz-sub" style="margin-top:8px;">Only .pdf files are supported</div>
      <div id="upload-status" role="status" data-testid="upload-status">No file uploaded yet.</div>
    </div>

    <hr class="rule">

    <!-- Question -->
    <div data-testid="question-section">
      <label for="question" id="question-label" class="field-label">Your question</label>
      <textarea id="question" name="question" rows="3" placeholder="What do my notes say about..." aria-label="Your question" data-testid="question-input"></textarea>
      <div class="row-between">
        <div id="status" role="status" data-testid="status"></div>
        <button id="ask-btn" type="submit" aria-label="Submit" data-testid="submit-button">Submit</button>
      </div>
    </div>

    <hr class="rule">

    <!-- Answer -->
    <div data-testid="answer-section">
      <label class="field-label" id="answer-label">Answer</label>
      <div id="meta">
        <span id="type-pill" class="pill hidden" data-testid="type-pill"></span>
        <span id="tool-pill" class="pill hidden" data-testid="tool-pill"></span>
      </div>
      <div id="answer" data-testid="answer">
        <div id="answer-text" data-testid="answer-text">Your answer will appear here...</div>
      </div>
      <details id="sources-wrap" class="hidden" data-testid="sources-wrap">
        <summary>Sources (top chunks used)</summary>
        <ol id="sources"></ol>
      </details>
    </div>

  </div>

  <footer>Built as part of the AI Engineering Bootcamp</footer>

<script src="app.js"></script>
</body>
</html>
